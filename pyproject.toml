[project]
name = "cgsol"
version = "0.1.0"
description = "GitHub-as-bus orchestrator for an agent-driven maintenance pipeline"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.35",
    "httpx>=0.27.0,<0.29",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.5.0,<3",
    "PyYAML>=6.0.1,<7",
    "sse-starlette>=2.1.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<0.26",
    "ruff>=0.7.0,<0.13",
    "mypy>=1.11.0,<2",
    "types-PyYAML>=6.0.12,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# The seeder ran once against the fork and is kept verbatim for reproduction.
extend-exclude = ["seed/sanitize.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.10"
packages = ["orchestrator"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# `sanitize` is the vendored corpus tool in seed/, imported by path at runtime.
module = ["sse_starlette.*", "sanitize"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
