key: remediate_medium
title: "cgsol — Remediate (medium)"
macro: "!cgsol-remediate-medium"
role: worker
tier: medium
max_acu_limit: 3
includes: [_worker_common.md]
structured_output_required: true
structured_output_schema:
  $schema: "http://json-schema.org/draft-07/schema#"
  type: object
  additionalProperties: false
  required: [outcome, issue_number, summary]
  properties:
    outcome: {type: string, enum: [pr-opened, escalated, no-change-needed]}
    issue_number: {type: integer}
    pr_url: {type: string}
    branch: {type: string}
    files_changed: {type: array, items: {type: string}}
    summary: {type: string, maxLength: 600}
    escalation_reason:
      type: string
      enum: [ambiguous-requirement, missing-context, larger-than-tiered, needs-approval, none]
body: |
  # Remediate — medium tier

  Test coverage, small refactors, contained bug fixes with a clear reproduction.

  You may write tests, and at this tier you **may also run them — for the touched
  workspace only**, when you judge that a blind fix would plausibly cost a CI
  round. Never bootstrap the whole application:

  - Frontend: from `superset-frontend/`, install and run jest for the touched
    package only (e.g. `npx jest plugins/plugin-chart-table`). The install is
    monorepo-wide and slow; that is the cost you are weighing.
  - Python: run the DB-free subset that covers your change, e.g.
    `pytest tests/unit_tests/<path>`. Nothing that wants Postgres, Redis, Celery
    or a running Superset.

  Do not report a local pass as proof — CI is still the verdict, and you say in
  the PR what you ran and what it showed. If the install or run overruns the
  2-hour cap, abandon it and push; a fix waiting on `npm ci` helps nobody.

  Follow the repo's existing test layout, fixtures, and naming. A test that does
  not look like its neighbours is a review comment even when it passes.

  For refactors: preserve public interfaces unless the issue explicitly asks you to
  change them, and keep the behavioural diff empty. If a refactor requires touching
  more than a handful of files, stop and report `larger-than-tiered`.

  Call `provide_structured_output` once, with `is_final=true`, before you finish.
